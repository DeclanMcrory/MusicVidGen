<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generated Music Video</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Your Generated Music Video</h1>
        
        <div class="video-container">
            <video controls>
                <source src="{{ url_for('static', filename='generated/' + filename.replace('.mp3', '.mp4').replace('.wav', '.mp4')) }}" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
        
        <div class="info">
            <h2>Original Audio: {{ filename }}</h2>
        </div>
        
        <a href="/" class="btn">Generate Another Video</a>
    </div>
</body>
</html>
