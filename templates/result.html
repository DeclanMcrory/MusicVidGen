<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Video Result</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        h1 {
            color: #333;
        }
        .container {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .video-container {
            margin-top: 20px;
        }
        .download-link {
            margin-top: 20px;
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .download-link:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Generated Music Video for {{ filename }}</h1>
        <div class="video-container">
            <!-- Assuming the video is saved in a static folder and can be accessed via a URL -->
            <video width="600" controls>
                <source src="{{ url_for('static', filename='videos/' + filename) }}" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
        <a href="{{ url_for('static', filename='videos/' + filename) }}" class="download-link" download>Download Video</a>
    </div>
</body>
</html>
